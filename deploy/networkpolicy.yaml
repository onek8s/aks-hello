# The namespace only accepts connections from its own pods by default. The Envoy proxies that AKS
# App Routing runs for the public Gateway live in ingress-gateway and connect straight to the pods,
# so they are let in - to this app's port alone.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aks-hello-from-gateway
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: aks-hello
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-gateway
      ports:
        - protocol: TCP
          port: 8080
