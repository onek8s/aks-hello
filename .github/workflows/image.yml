name: Image

# Builds the image on every pull request and push to main, to prove it builds. Nothing is published
# from here and this repository holds no cloud credential: the environment's Azure Container Registry
# builds the image itself, from this public repository at a pinned commit, under the <Version> of
# src/AksHello/AksHello.csproj (onek8s/aks-terraform, shared/envs/<environment>.tfvars:
# container_registry_builds). The clusters pull it from there as their kubelet identities.
# Built and smoke-tested on both architectures the clusters' nodes can have, each on a native runner.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Read the version
        id: version
        run: |
          version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/AksHello/AksHello.csproj)"
          test -n "$version" || { echo "::error::No <Version> in src/AksHello/AksHello.csproj"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: aks-hello:${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      # The page and /status name the cluster it runs in; the probes answer.
      - name: Smoke test
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          docker run -d --name hello -p 8080:8080 -e CLUSTER_NAME=ci-smoke-test "aks-hello:${VERSION}"
          for _ in $(seq 1 30); do curl -fsS http://localhost:8080/healthz >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://localhost:8080/ | tee page.html | grep -q 'ci-smoke-test'
          grep -q "$VERSION" page.html
          curl -fsS http://localhost:8080/health/live
          curl -fsS http://localhost:8080/health/ready
          curl -fsS http://localhost:8080/status | tee status.json | grep -q '"cluster":"ci-smoke-test"'
          grep -q "\"version\":\"$VERSION" status.json
          # The forecast comes from the internet; the runner reaches it, so the page shows one
          curl -fsS http://localhost:8080/weather | tee weather.json | grep -q '"error":null'
          grep -q 'class="weather"' <(curl -fsS http://localhost:8080/)
          # The node's public IP is checked once at start, in the background; the runner reaches the service
          for _ in $(seq 1 30); do curl -fsS http://localhost:8080/public-ip | grep -qv '"checkedAt":null' && break; sleep 1; done
          curl -fsS http://localhost:8080/public-ip | tee public-ip.json | grep -q '"error":null'
          grep -q '"nodePublicIp":"' <(curl -fsS http://localhost:8080/status)
          grep -q 'class="public-ip"' <(curl -fsS http://localhost:8080/)
          # A shell for debugging (0.6.0)
          docker exec hello bash -c 'id -u' | grep -qx 1654
          docker rm -f hello

  # The way the environment's registry builds the arm64 image: Dockerfile.arm64 with the classic
  # builder on an amd64 host, which runs the SDK natively and cross-compiles. Nothing runs under
  # emulation.
  registry:
    name: Build like the registry (Dockerfile.arm64 on amd64, classic builder)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build
        env:
          DOCKER_BUILDKIT: "0"
        run: docker build -f Dockerfile.arm64 -t aks-hello:registry .

      - name: Check the architecture
        run: |
          arch="$(docker image inspect aks-hello:registry --format '{{.Architecture}}')"
          echo "$arch"
          test "$arch" = arm64
