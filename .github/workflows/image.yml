name: Image

# Builds the image on every pull request and push to main, to prove it builds. Nothing is published
# from here and this repository holds no cloud credential: the environment's Azure Container Registry
# builds the image itself, from this public repository at a pinned commit, under the <Version> of
# src/AksHello/AksHello.csproj (onek8s/aks-terraform, shared/envs/<environment>.tfvars:
# container_registry_builds). The clusters pull it from there as their kubelet identities.
# Built and smoke-tested on both architectures the clusters' nodes can have, each on a native runner.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Read the version
        id: version
        run: |
          version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/AksHello/AksHello.csproj)"
          test -n "$version" || { echo "::error::No <Version> in src/AksHello/AksHello.csproj"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: aks-hello:${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      # The page names the cluster it runs in.
      - name: Smoke test
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          docker run -d --name hello -p 8080:8080 -e CLUSTER_NAME=ci-smoke-test "aks-hello:${VERSION}"
          for _ in $(seq 1 30); do curl -fsS http://localhost:8080/healthz >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://localhost:8080/ | tee page.html | grep -q 'ci-smoke-test'
          grep -q "$VERSION" page.html
          docker rm -f hello

  # The way the environment's registry builds it: an ACR task runs the classic builder on its amd64
  # host, with the target platform as build arguments. Nothing runs under emulation - the SDK stage
  # builds on the host's architecture - so this proves the arm64 image builds there too.
  registry:
    name: Build like the registry (linux/arm64 on amd64, classic builder)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build
        env:
          DOCKER_BUILDKIT: "0"
        run: docker build --build-arg TARGETARCH=arm64 --build-arg TARGETPLATFORM=linux/arm64 -t aks-hello:registry .

      - name: Check the architecture
        run: |
          arch="$(docker image inspect aks-hello:registry --format '{{.Architecture}}')"
          echo "$arch"
          test "$arch" = arm64
