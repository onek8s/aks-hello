name: Image

# Pull requests build the image to prove it builds. A push to main publishes it to GHCR, tagged with
# the <Version> in src/AksHello/AksHello.csproj - so a release is a pull request that bumps that
# version and the tag in deploy/deployment.yaml together. A version that is already published is
# never overwritten.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Read the version
        id: version
        run: |
          version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/AksHello/AksHello.csproj)"
          test -n "$version" || { echo "::error::No <Version> in src/AksHello/AksHello.csproj"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The manifest deploys exactly the version the project builds; a bump of one without the other
      # would deploy an image that is not there, or one that is not this code.
      - name: Check the manifest names the same version
        run: |
          grep -q "image: ${IMAGE}:${{ steps.version.outputs.version }}$" deploy/deployment.yaml || {
            echo "::error file=deploy/deployment.yaml::The image tag must be ${{ steps.version.outputs.version }}, the <Version> of the project"
            exit 1
          }

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether the version is already published
        id: published
        if: github.event_name != 'pull_request'
        run: |
          if docker buildx imagetools inspect "${IMAGE}:${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "::notice::${IMAGE}:${{ steps.version.outputs.version }} is already published; bump <Version> to publish this commit"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=sha,format=long

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' && steps.published.outputs.exists == 'false' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
