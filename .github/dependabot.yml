version: 2

updates:
  - package-ecosystem: nuget
    directory: /src/AksHello
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "nuget"

  # The SDK and runtime base images in the Dockerfile.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "docker"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
